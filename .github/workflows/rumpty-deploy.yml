name: Deploy to RumptyCloud

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "api/**"
      - "deploy/**"
      - ".github/workflows/rumpty-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Next.js static export
        working-directory: web
        run: npm ci && npm run build
      - name: Assemble web and API deployment bundle
        shell: bash
        run: |
          mkdir -p dist/web/out dist/api
          cp -R web/out/. dist/web/out/
          cp web/nginx.conf web/Dockerfile.runtime dist/web/
          mv dist/web/Dockerfile.runtime dist/web/Dockerfile
          cp api/Dockerfile api/requirements.txt api/main.py api/sms.py dist/api/
          cp deploy/docker-compose.yml dist/docker-compose.yml
          tar -czf defend-it.tar.gz -C dist .
      - name: Install Rumpty CLI
        run: |
          curl -fsSL https://get.rumptycloud.com | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Deploy to Rumpty VM
        env:
          RUMPTY_API_KEY: ${{ secrets.RUMPTY_TOKEN }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$VM_SSH_KEY" > /tmp/rumpty_deploy_key
          chmod 600 /tmp/rumpty_deploy_key
          rumpty copy ./defend-it.tar.gz inverse:/tmp/defend-it.tar.gz --ws qo-01a1b65d --identity /tmp/rumpty_deploy_key
          rumpty exec inverse --ws qo-01a1b65d --identity /tmp/rumpty_deploy_key -- sudo systemctl disable --now rumpty-welcome.service || true
          rumpty exec inverse --ws qo-01a1b65d --identity /tmp/rumpty_deploy_key -- sudo mkdir -p /opt/defend-it
          rumpty exec inverse --ws qo-01a1b65d --identity /tmp/rumpty_deploy_key -- sudo tar -xzf /tmp/defend-it.tar.gz -C /opt/defend-it
          rumpty exec inverse --ws qo-01a1b65d --identity /tmp/rumpty_deploy_key -- sudo docker compose --project-directory /opt/defend-it -f /opt/defend-it/docker-compose.yml up -d --build
          rm -f /tmp/rumpty_deploy_key
